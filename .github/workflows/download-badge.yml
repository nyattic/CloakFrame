name: Download badge

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/update-download-badge.js
      - .github/workflows/download-badge.yml
  release:
    types:
      - published
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Update filtered download count
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v8
        with:
          retries: 3
          script: |
            const updateDownloadBadge = require(
              './.github/scripts/update-download-badge.js')
            await updateDownloadBadge({ github, context, core })
